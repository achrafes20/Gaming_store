name: gaming-store

services:
  # ---- Infrastructure -----------------------------------------------------

  catalog-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: catalog_db
    volumes:
      - catalog_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders_db
    volumes:
      - orders_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: users_db
    volumes:
      - users_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Application services -------------------------------------------------

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    env_file: services/catalog-service/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: catalog-db
      DB_DATABASE: catalog_db
      DB_PASSWORD: root
      ORDERS_SERVICE_URL: http://orders-service
    volumes:
      - catalog_uploads:/var/www/html/public/uploads
    depends_on:
      catalog-db:
        condition: service_healthy

  orders-service:
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
    env_file: services/orders-service/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: orders-db
      DB_DATABASE: orders_db
      DB_PASSWORD: root
      CATALOG_SERVICE_URL: http://catalog-service
      RABBITMQ_HOST: rabbitmq
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  users-service:
    build:
      context: .
      dockerfile: services/users-service/Dockerfile
    env_file: services/users-service/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: users-db
      DB_DATABASE: users_db
      DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
    depends_on:
      users-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notifications-service:
    build:
      context: .
      dockerfile: services/notifications-service/Dockerfile
    env_file: services/notifications-service/.env
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  web-bff:
    build:
      context: .
      dockerfile: services/web-bff/Dockerfile
    env_file: services/web-bff/.env
    environment:
      CATALOG_SERVICE_URL: http://catalog-service
      ORDERS_SERVICE_URL: http://orders-service
      USERS_SERVICE_URL: http://users-service
    depends_on:
      - catalog-service
      - orders-service
      - users-service

  # ---- Single public entry point --------------------------------------------

  api-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - catalog-service
      - orders-service
      - users-service
      - web-bff

volumes:
  catalog_db_data:
  orders_db_data:
  users_db_data:
  catalog_uploads:
