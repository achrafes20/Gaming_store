apiVersion: 1

datasources:
  # Explicit `uid`s (Grafana would otherwise generate random ones on first
  # provisioning) — the dashboard JSON in
  # monitoring/grafana/provisioning/dashboards/json/ references these exact
  # strings, so panels resolve correctly on a fresh `docker compose up`
  # instead of showing "datasource not found".
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
