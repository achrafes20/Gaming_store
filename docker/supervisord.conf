[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Streams Laravel's JSON log file to this container's real stdout, where
# `docker logs`/`kubectl logs` and Promtail (Phase 6) actually see it.
# Not redundant with php-fpm's own stdout_logfile/stderr_logfile above:
# those capture the FPM *master* process's own output, not what application
# code inside a *worker* writes to php://stderr — php-fpm's
# catch_workers_output (docker.conf) is supposed to forward that too, but
# doesn't reliably in this image (confirmed with a real Log::error() call
# that produced no output anywhere — see config/logging.php's 'single'
# channel for the full story). `tail -F` on the file Monolog actually
# writes to sidesteps the whole worker-output question.
[program:log-forwarder]
command=tail -F /var/www/html/storage/logs/laravel.log
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
