apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: gaming-store
spec:
  replicas: 1 # a queue consumer — more replicas would double-process messages
             # without also configuring competing-consumer semantics first
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      containers:
        - name: notifications-service
          image: gaming-store-notifications-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: notifications-service-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: notifications-service-secret
                  key: APP_KEY
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notifications-service-secret
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notifications-service-secret
                  key: MAIL_PASSWORD
          # No HTTP server here (long-running `artisan events:consume`
          # worker) — check the process itself instead of a port.
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "events:consume"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 192Mi
