apiVersion: v1
kind: ConfigMap
metadata:
  name: web-bff-config
  namespace: gaming-store
data:
  APP_NAME: web-bff
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8080
  LOG_CHANNEL: single
  LOG_LEVEL: debug
  DB_CONNECTION: sqlite
  SESSION_DRIVER: file
  QUEUE_CONNECTION: database
  # "file", not "database" (unlike the other 3 services): web-bff has no
  # real database of its own — "database" cache crashed every request that
  # touches the cache (found via Phase 5's rate limiter, see SECURITY.md).
  CACHE_STORE: file
  CATALOG_SERVICE_URL: http://catalog-service
  ORDERS_SERVICE_URL: http://orders-service
  USERS_SERVICE_URL: http://users-service
  MAIL_MAILER: log
  JAEGER_OTLP_URL: http://jaeger:4318
