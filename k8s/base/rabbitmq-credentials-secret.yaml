# RabbitMQ's own default guest/guest — same as docker-compose.yml, fine for
# local demo use only (the guest user is refused on non-loopback connections
# by RabbitMQ itself in real deployments).
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: gaming-store
type: Opaque
stringData:
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
