apiVersion: v1
kind: ConfigMap
metadata:
  name: users-service-config
  namespace: gaming-store
data:
  APP_NAME: users-service
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8080
  LOG_CHANNEL: single
  LOG_LEVEL: debug
  DB_CONNECTION: mysql
  DB_HOST: users-db
  DB_PORT: "3306"
  DB_DATABASE: users_db
  DB_USERNAME: root
  SESSION_DRIVER: array
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  MAIL_MAILER: log
  JAEGER_OTLP_URL: http://jaeger:4318
