apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - mysql-credentials-secret.yaml
  - rabbitmq-credentials-secret.yaml

  - catalog-db/statefulset.yaml
  - catalog-db/service.yaml
  - orders-db/statefulset.yaml
  - orders-db/service.yaml
  - users-db/statefulset.yaml
  - users-db/service.yaml
  - rabbitmq/statefulset.yaml
  - rabbitmq/service.yaml

  - catalog-service/configmap.yaml
  - catalog-service/uploads-pvc.yaml
  - catalog-service/deployment.yaml
  - catalog-service/service.yaml

  - orders-service/configmap.yaml
  - orders-service/deployment.yaml
  - orders-service/service.yaml

  - users-service/configmap.yaml
  - users-service/deployment.yaml
  - users-service/service.yaml

  - notifications-service/configmap.yaml
  - notifications-service/deployment.yaml

  - web-bff/configmap.yaml
  - web-bff/sessions-pvc.yaml
  - web-bff/deployment.yaml
  - web-bff/service.yaml

  - api-gateway/configmap.yaml
  - api-gateway/deployment.yaml
  - api-gateway/service.yaml
  - api-gateway/ingress.yaml

# GitOps release tag — the ONE place that changes on every release. Kept as
# a single shared tag across all 5 (scripts/gitops-release.sh always builds
# them together) rather than scattered `newTag:` edits per Deployment file,
# so a release is exactly one line-scoped diff for Argo CD to sync.
#
# This is also what actually fixes the "stale image" bug from Phase 2:
# Docker Desktop Kubernetes doesn't reliably notice a same-tag (`:latest`)
# rebuild, so a pod kept running the old code after `docker compose build`.
# A tag that changes on every release forces a real pull every time —
# no more silent staleness, and nothing to remember to work around.
images:
  - name: gaming-store-catalog-service
    newTag: 539485f
  - name: gaming-store-orders-service
    newTag: 539485f
  - name: gaming-store-users-service
    newTag: 539485f
  - name: gaming-store-web-bff
    newTag: 539485f
  - name: gaming-store-notifications-service
    newTag: 539485f
