# Same plaintext local-dev credentials already used in docker-compose.yml
# (root/root) — not a real secret, just kept as a Secret object for the right
# K8s pattern. Rotate via `kubectl create secret ... --dry-run=client -o yaml
# | kubectl apply -f -` for anything beyond local demo use.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: gaming-store
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root
