# Requires an ingress controller (e.g. ingress-nginx — see
# scripts/k8s-deploy.sh, which installs it if missing). No host restriction:
# reachable on whatever address the controller's LoadBalancer/NodePort maps
# to locally, matching docker-compose's single "http://localhost:8080" entry
# point.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaming-store
  namespace: gaming-store
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
