# Same routing logic as gateway/nginx.conf (docker-compose), simplified for
# Kubernetes: no `resolver`/variable trick needed here, because a K8s Service
# ClusterIP is a stable virtual IP for the Service's whole lifetime — DNS
# resolves the name to that IP once, and kube-proxy transparently routes to
# whichever pod currently backs it. Only Docker Compose's raw container IPs
# (which really do change on every recreate) need the dynamic-resolver dance.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: gaming-store
data:
  default.conf: |
    server {
        listen 80;
        client_max_body_size 20M;

        # /api/internal/* is service-to-service only (see docs/architecture.md
        # and SECURITY.md, OWASP A01) — blocked here as the primary defense;
        # nginx matches the longest plain prefix regardless of file order, so
        # these take priority over /api/catalog/ and /api/orders/ below.
        location /api/catalog/internal/ {
            return 403;
        }

        location /api/orders/internal/ {
            return 403;
        }

        location /api/catalog/ {
            rewrite ^/api/catalog/(.*)$ /api/$1 break;
            proxy_pass http://catalog-service:80/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/orders/ {
            rewrite ^/api/orders/(.*)$ /api/$1 break;
            proxy_pass http://orders-service:80/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/users/ {
            rewrite ^/api/users/(.*)$ /api/$1 break;
            proxy_pass http://users-service:80/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Uploaded product/category images live on catalog-service.
        location /uploads/ {
            proxy_pass http://catalog-service:80$uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # web-bff's /metrics (Phase 6) is Prometheus-scrape-only, never
        # public — same reasoning as the /internal/ blocks above.
        location = /metrics {
            return 403;
        }

        location / {
            proxy_pass http://web-bff:80;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
