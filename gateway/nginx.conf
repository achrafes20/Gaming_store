# Single public entry point — routes by path prefix to each service
# (nginx+php-fpm in one container each, see services/*/Dockerfile).
#
# Two nginx gotchas stacked here, both required for this to work correctly:
#
# 1. proxy_pass targets are stored in variables and resolved via Docker's
#    embedded DNS (127.0.0.11) with a short TTL, instead of the bare
#    `http://catalog-service:80/` form nginx would otherwise resolve ONCE
#    at startup and cache forever — without this, rebuilding/restarting a
#    single backend service (its container gets a new IP) silently breaks
#    routing through the gateway until the gateway itself is restarted.
#
# 2. Because the host is a variable, nginx can no longer do its usual
#    "replace the matched location prefix in the URI" trick — a literal
#    trailing "/" in `proxy_pass http://$var:80/;` is sent AS the request
#    URI verbatim (always "/"), silently discarding whatever `rewrite`
#    computed. Appending $uri (plus $is_args$args) explicitly fixes this.
#
# 3. `proxy_set_header Host $host;` forwards the Host header WITHOUT its
#    port (nginx's `$host` variable strips it by definition) — Laravel then
#    builds every asset()/url() link from that port-less Host, so the
#    browser fetches CSS/JS on the wrong port (curl to the backend still
#    "works" since it doesn't care about the port in the HTML it got back).
#    `$http_host` preserves the port exactly as the client sent it.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    client_max_body_size 20M;

    # /api/internal/* on catalog-service and orders-service is
    # service-to-service only (see docs/architecture.md) — it was reachable
    # by anyone through this gateway before this block existed (a real gap,
    # see SECURITY.md, OWASP A01). nginx picks the longest matching plain
    # prefix regardless of file order, so these two take priority over the
    # broader /api/catalog/ and /api/orders/ blocks below without needing to
    # be listed first. The services also reject these calls at the
    # application layer now (a shared X-Internal-Secret header) — this is
    # the primary defense, that one is the fallback.
    location /api/catalog/internal/ {
        return 403;
    }

    location /api/orders/internal/ {
        return 403;
    }

    location /api/catalog/ {
        set $catalog_upstream catalog-service;
        rewrite ^/api/catalog/(.*)$ /api/$1 break;
        proxy_pass http://$catalog_upstream:80$uri$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/orders/ {
        set $orders_upstream orders-service;
        rewrite ^/api/orders/(.*)$ /api/$1 break;
        proxy_pass http://$orders_upstream:80$uri$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/users/ {
        set $users_upstream users-service;
        rewrite ^/api/users/(.*)$ /api/$1 break;
        proxy_pass http://$users_upstream:80$uri$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Phase 8 — chatbot-service. Unlike /api/catalog/ etc., "chat" isn't a
    # namespace prefix in front of further sub-paths — chatbot-service's
    # whole API surface IS POST /api/chat, so there's nothing to `rewrite`
    # away; an exact-match location just forwards $uri (== "/api/chat" here)
    # straight through. Gemini calls can genuinely take several seconds
    # (especially a multi-round tool-call turn), well past nginx's 60s
    # default proxy_read_timeout in a slow case — raised generously here so
    # a legitimately slow model turn doesn't get cut off mid-response.
    location = /api/chat {
        set $chatbot_upstream chatbot-service;
        proxy_pass http://$chatbot_upstream:80$uri$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Uploaded product/category images physically live on catalog-service
    # (the only service that writes to public/uploads) — views reference them
    # as plain "/uploads/..." URLs, so the gateway must route that prefix there.
    location /uploads/ {
        set $catalog_uploads_upstream catalog-service;
        proxy_pass http://$catalog_uploads_upstream:80$uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # web-bff's /metrics (Phase 6) is Prometheus-scrape-only, never public —
    # same reasoning as the /internal/ blocks above. It sits behind the
    # catch-all `/` block below (web-bff, unlike the API services, doesn't
    # have a gateway prefix of its own), so it needs its own explicit block
    # here or it would be reachable from outside like any other web-bff page.
    location = /metrics {
        return 403;
    }

    # web-bff's own /chat (the browser widget hits this, not /api/chat
    # directly — see App\Http\Controllers\ChatController) sits behind the
    # catch-all `/` below same as /metrics does, so it needs the same
    # generous read timeout as /api/chat's own block above, or a slow
    # multi-tool-call turn hits nginx's 60s default and 504s here even
    # though chatbot-service itself was still working on it — found by a
    # real request timing out, not by reading the two blocks side by side.
    location = /chat {
        set $web_bff_upstream web-bff;
        proxy_pass http://$web_bff_upstream:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Everything else goes to web-bff — the site itself.
    location / {
        set $web_bff_upstream web-bff;
        proxy_pass http://$web_bff_upstream:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
