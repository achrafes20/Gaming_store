# Single public entry point — routes by path prefix to each service
# (nginx+php-fpm in one container each, see services/*/Dockerfile).
#
# Note: proxy_pass MUST end with a trailing "/" here — without it, nginx
# ignores the `rewrite` above it and forwards the client's original,
# un-rewritten URI instead (a well-known nginx gotcha).
server {
    listen 80;
    client_max_body_size 20M;

    location /api/catalog/ {
        rewrite ^/api/catalog/(.*)$ /api/$1 break;
        proxy_pass http://catalog-service:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/orders/ {
        rewrite ^/api/orders/(.*)$ /api/$1 break;
        proxy_pass http://orders-service:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/users/ {
        rewrite ^/api/users/(.*)$ /api/$1 break;
        proxy_pass http://users-service:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else goes to web-bff — the site itself, and its own /uploads.
    location / {
        proxy_pass http://web-bff:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
